# Run testthat tests
name: Run Tests

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.config.os }}

    name: Tests on ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::covr
            any::ggplot2
            any::dplyr
            any::tibble
          needs: check

      - name: Run tests
        run: |
          testthat::test_local(stop_on_failure = TRUE, reporter = "summary")
        shell: Rscript {0}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: tests/testthat/

